name: Validate playable world runtime

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/runtime-check.yml"
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/runtime-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate browser source syntax
        run: |
          node --check src/bootstrap.js
          node --check src/main.js
          node --check src/geometry-rebaseline.js
          node --check src/brick-engine.js
          node --check src/twin-status.js
          node --check src/peer-sync.js
          node --check src/world-terrain.js
          node --check src/world-runtime.js
          node --check src/construction-gameplay.js
