name: Validate playable world runtime

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/runtime-check.yml"
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/runtime-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source and model ledgers
        run: npm run check
