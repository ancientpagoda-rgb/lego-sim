name: Cross-check 5986 LDD geometry

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ldd-crosscheck.yml"
      - "scripts/ldd-import.mjs"
      - "scripts/ldd-reconcile.mjs"
      - "scripts/ldd-unique-inventory.mjs"
      - "data/5986-instruction-sources.json"
      - "data/5986-inventory.csv"
      - "data/5986-model.json"
      - "data/5986-parts-*.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch community LDD model temporarily
        run: curl --fail --location --retry 3 --output /tmp/5986.lxf https://www.brickshelf.com/gallery/penguin3332/5986/secret_jungle_temple.lxf
      - name: Parse geometry candidates and safe summary
        run: node scripts/ldd-import.mjs /tmp/5986.lxf --write --summary-out data/5986-ldd-summary.json
      - name: Reconcile candidates to current model
        run: node scripts/ldd-reconcile.mjs data/5986-ldd-candidates.json --out data/5986-ldd-model-matches.json
      - name: Extract unique inventory anchors
        run: node scripts/ldd-unique-inventory.mjs data/5986-ldd-candidates.json --out data/5986-ldd-unique-candidates.json
      - name: Upload transient full transform candidates
        uses: actions/upload-artifact@v4
        with:
          name: 5986-ldd-candidates
          path: data/5986-ldd-candidates.json
          retention-days: 1
      - name: Confirm source-integrity rules
        run: node scripts/source-integrity.mjs
      - name: Commit safe reconciliation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/5986-ldd-summary.json data/5986-ldd-model-matches.json data/5986-ldd-unique-candidates.json
          if git diff --cached --quiet; then
            echo "LDD reconciliation outputs unchanged"
            exit 0
          fi
          git commit -m "Update LDD model reconciliation"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
