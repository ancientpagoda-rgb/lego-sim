<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101510" />
  <title>LEGO Sim — 5986 Amazon Ancient Ruins</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <main id="app">
    <canvas id="sim"></canvas>
    <section class="hud" aria-label="Simulation controls">
      <div class="title-block">
        <div class="eyebrow">LEGO SIM / WORLD 5986</div>
        <h1>Amazon Ancient Ruins</h1>
        <p id="status">Loading full set…</p>
      </div>
      <div class="controls">
        <button id="togglePlay" class="primary">Pause</button>
        <button id="reset">Reset set</button>
        <button id="traps">Run traps</button>
        <button id="cameraMode">Camera: orbit</button>
        <label class="switch"><input id="gravity" type="checkbox" checked /> Gravity</label>
        <label class="switch"><input id="agents" type="checkbox" checked /> Minifig AI</label>
        <label class="speed">Time
          <select id="speed">
            <option value="1">1×</option>
            <option value="10">10×</option>
            <option value="100">100×</option>
          </select>
        </label>
      </div>
      <div class="help">Drag to orbit · pinch/scroll to zoom · tap bricks to break connections · Run traps drops the bridge and opens the trapdoor</div>
    </section>
    <div id="crosshair" aria-hidden="true"></div>
  </main>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
